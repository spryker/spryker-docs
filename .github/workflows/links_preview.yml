name: Links preview

on:
  pull_request:
    types: [opened, synchronize]

# Essential for the workflow to read code and write comments to the PR
permissions:
  pull-requests: write
  contents: read

jobs:
  process-and-comment:
    runs-on: ubuntu-latest
    steps:
      # Depth 2 covers the PR merge commit and its first parent (the base branch)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed links
        id: links
        env:
          GITHUB_BASE_SHA: HEAD^1
          GITHUB_HEAD_SHA: HEAD
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'links<<LINKS_EOF'
            bash _scripts/changed_links.sh "https://deploy-preview-${PR_NUMBER}--spryker-docs.netlify.app/" | grep '^http' || true
            echo 'LINKS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.links.outputs.links != ''
        uses: actions/github-script@v7
        env:
          LINKS: ${{ steps.links.outputs.links }}
        with:
          script: |
            const marker = '<!-- links-preview -->';
            const links = process.env.LINKS.split('\n').map(l => `- ${l}`).join('\n');
            const body = `${marker}\n### 🔗 Changed pages\n\n${links}\n\nMake sure that preview was deployed before using these links.`;
            const params = { owner: context.repo.owner, repo: context.repo.repo };

            // Update the previous links comment instead of posting a new one on every push
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...params,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({ ...params, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number, body });
            }