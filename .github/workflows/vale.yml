name: Is style great?

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vale-lint:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v5

    # Step 2: Install Vale from the GitHub release.
    # Snap is not used because the snap store is unreliable on GitHub-hosted runners.
    - name: Install Vale
      env:
        VALE_VERSION: 3.25.1
      run: |
        curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/vale.tar.gz" \
          "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
        mkdir -p "${HOME}/.local/bin"
        tar -xzf "${RUNNER_TEMP}/vale.tar.gz" -C "${HOME}/.local/bin" vale
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/vale" --version

    # Step 3: Run Vale linter
    - name: Run Vale linter
      run: |
        vale $(find docs/ _includes/pbc/ -type f -name "*.md" ! -path "*/202311.0/*" ! -path "*/202404.0/*") --minAlertLevel=error
      continue-on-error: false
