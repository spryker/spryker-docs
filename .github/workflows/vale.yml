name: Is style great?

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vale-lint:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v5

    # Step 2: Install Vale
    # Pinned deliberately: `snap install vale` tracks latest, so an upstream
    # release silently changes the rules and breaks every open PR.
    # Bump this version only together with the doc fixes the new version requires.
    - name: Install Vale
      env:
        VALE_VERSION: 3.15.2
      run: |
        curl -fsSL -o vale.tar.gz \
          "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
        sudo tar -xzf vale.tar.gz -C /usr/local/bin vale
        rm vale.tar.gz
        vale --version

    # Step 3: Run Vale linter
    - name: Run Vale linter
      run: |
        vale $(find docs/ _includes/pbc/ -type f -name "*.md" ! -path "*/202311.0/*" ! -path "*/202404.0/*") --minAlertLevel=error
      continue-on-error: false
